name: tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  rag-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag_service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: rag_service/requirements.txt
      - run: pip install -r requirements.txt
      # Offline suite only: no OpenAI key needed; live model checks (-m live) are excluded by pytest.ini.
      - run: pytest -q --cov=app --cov-report=term-missing
